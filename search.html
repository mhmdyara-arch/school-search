    function searchStudent() {
        const id = document.getElementById("studentId").value.trim();
        const resultDiv = document.getElementById("result");
        const errorDiv = document.getElementById("errorMsg");
        
        // إخفاء النتائج السابقة
        resultDiv.style.display = "none";
        errorDiv.style.display = "none";
        errorDiv.innerText = "";

        if (!id) {
            errorDiv.innerText = "الرجاء إدخال رقم الهوية.";
            errorDiv.style.display = "block";
            return;
        }

        const student = students[id];

        if (student) {
            const commNum = student.committee;
            const locationData = locations[commNum];

            document.getElementById("name").innerText = student.name;
            document.getElementById("committee").innerText = commNum;
            
            if (locationData) {
                document.getElementById("location").innerText = locationData.room;
                document.getElementById("floor").innerText = locationData.floor;
            } else {
                document.getElementById("location").innerText = "غير محدد";
                document.getElementById("floor").innerText = "غير محدد";
            }

            resultDiv.style.display = "block";
        } else {
            errorDiv.innerText = "لم يتم العثور على طالب بهذا الرقم. يرجى التأكد من الرقم.";
            errorDiv.style.display = "block";
        }
    }
</script>
